[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Le service worker doit toujours être relu, sinon les mises à jour de la PWA tardent.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
